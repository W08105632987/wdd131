<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animated Landing Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(to bottom right, #1f1f2e, #2c2c3f);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .slider {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 250px;
      height: 250px;
      z-index: 0;
    }

    .slider img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .slider img.active {
      opacity: 1;
      z-index: 1;
    }

    .hero {
      position: relative;
      z-index: 1;
      padding-top: 200px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      animation: fadeInDown 1s ease forwards;
    }

    p {
      font-size: 1rem;
      margin: 10px 0 20px;
      animation: fadeInUp 1s ease 0.5s forwards;
    }

    .btn {
      background: #f8f8f8;
      color: #000;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #ddd;
    }

    .features {
      margin-top: 30px;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 10px;
      animation: fadeInUp 1.5s ease forwards;
    }

    .feature-box {
      background: rgba(255, 255, 255, 0.08);
      padding: 15px;
      border-radius: 15px;
      width: 100px;
      font-size: 0.8rem;
      text-align: center;
      backdrop-filter: blur(5px);
    }

    @keyframes fadeInDown {
      0% { opacity: 0; transform: translateY(-30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @media (min-width: 768px) {
      .container {
        max-width: 600px;
        padding: 50px;
      }

      .slider {
        width: 350px;
        height: 350px;
      }

      .feature-box {
        width: 150px;
        font-size: 1rem;
      }

      h1 {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="slider">
      <img src="slide1.jpg" class="active" alt="Slide 1" />
      <img src="slide2.jpg" alt="Slide 2" />
      <img src="slide3.jpg" alt="Slide 3" />
    </div>
    <div class="hero">
      <h1>Welcome to Our Website</h1>
      <p>An innovative approach to digital design</p>
      <button class="btn">Get Started</button>
      <div class="features">
        <div class="feature-box">Feature One</div>
        <div class="feature-box">Feature Two</div>
        <div class="feature-box">Feature Three</div>
      </div>
    </div>
  </div>

  <script>
    const slides = document.querySelectorAll('.slider img');
    let current = 0;

    function showNextSlide() {
      slides[current].classList.remove('active');
      current = (current + 1) % slides.length;
      slides[current].classList.add('active');
    }

    setInterval(showNextSlide, 3000);
  </script>
</body>
</html>
