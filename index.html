    * {

      padding: 0;

    }


    body {

    }

      box-shadow:
    6px 6px 12px rgba(0, 0, 0, 0.05),

    width: ;

    .profile-pic {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 10px 10px 20px var(--neumorph-dark), -10px -10px 20px var(--neumorph-light);
      margin-bottom: 2rem;
    }

    .profile-pic img {
      width: 100%;
      height: 100%;

    }

  .btn {
  display: inline-block;
  padding: 0.75rem 1.5rem;
  margin: 0.5rem;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  color: #222;
  font-weight: 600;
    
  transition: all 0.3s ease;
  text-decoration: none;
  cursor: pointer;
  width: 80%;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow:
    4px 4px 10px rgba(0, 0, 0, 0.1),
    -4px -4px 10px rgba(255, 255, 255, 0.6);
}

 .class-btn {
  display: inline-block;
  padding: 0.75rem 1.5rem;
  margin: 0.5rem;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  color: #222;
  font-weight: 600;
    
  transition: all 0.3s ease;
  text-decoration: none;
  cursor: pointer;
  width: 100%;
}

.class-btn:hover {
  transform: translateY(-2px);
  box-shadow:
    4px 4px 10px rgba(0, 0, 0, 0.1),
    -4px -4px 10px rgba(255, 255, 255, 0.6);
}



    .typing-text {
      font-size: 2rem;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: typing 4s steps(30, end), blink-caret 0.75s step-end infinite;
      white-space: nowrap;
      overflow: hidden;
      border-right: 3px solid rgba(255, 255, 255, 0.75);
      width: 100%;
      max-width: 20ch;
      margin: 0 auto 2rem;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 20ch; }
    }

    @keyframes blink-caret {
      from, to { border-color: transparent; }
      50% { border-color: rgba(255, 255, 255, 0.75); }
    }

    .falling-text {
      display: flex;
      justify-content: center;
      gap: 0.1em;
      font-size: 1.5rem;
      margin-bottom: 2rem;
    }

    .falling-text span {
      opacity: 0;
      transform: translateY(-50px);
      animation: fall 0.5s forwards;
    }

    .falling-text span:nth-child(1) { animation-delay: 0.1s; }
    .falling-text span:nth-child(2) { animation-delay: 0.2s; }
    .falling-text span:nth-child(3) { animation-delay: 0.3s; }
    .falling-text span:nth-child(4) { animation-delay: 0.4s; }
    .falling-text span:nth-child(5) { animation-delay: 0.5s; }
    .falling-text span:nth-child(6) { animation-delay: 0.6s; }
    .falling-text span:nth-child(7) { animation-delay: 0.7s; }

    @keyframes fall {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .portfolio-section {
      background: var(--primary-gradient);
      color: #fff;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 10px 10px 30px var(--neumorph-dark);
      margin-bottom: 2rem;
      width: 100%;
      max-width: 800px;
      transition: transform 0.3s ease;
    }

    .portfolio-section:hover {
      transform: scale(1.02);
    }

    @media (max-width: 768px) {
      .typing-text {
        font-size: 1.5rem;
      }
      .falling-text {
        font-size: 1.2rem;
      }
    }
  </style>
